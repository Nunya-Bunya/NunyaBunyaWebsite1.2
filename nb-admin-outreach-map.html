<style>
  .map-container { position: relative; width: 100%; min-height: 900px; overflow-x: auto; }
  .map-svg { width: 100%; min-width: 1100px; height: 900px; }

  /* Nodes */
  .node {
    cursor: pointer; transition: transform 0.15s, filter 0.15s;
  }
  .node:hover { transform: scale(1.03); filter: brightness(1.2); }
  .node rect, .node .node-bg {
    rx: 12; ry: 12; stroke-width: 1.5;
    transition: stroke 0.15s;
  }
  .node:hover rect, .node:hover .node-bg { stroke-width: 2.5; }

  /* Tooltip */
  .map-tooltip {
    position: fixed; background: #1a1a1a; border: 1px solid #333; border-radius: 10px;
    padding: 16px 20px; max-width: 340px; font-size: 13px; color: #ccc;
    line-height: 1.6; pointer-events: none; opacity: 0; transition: opacity 0.15s;
    z-index: 1000; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .map-tooltip.show { opacity: 1; }
  .map-tooltip h4 {
    font-family: var(--font-heading); font-size: 14px; font-weight: 800;
    text-transform: uppercase; color: #fff; margin: 0 0 6px;
  }
  .map-tooltip .tt-status {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px;
  }
  .map-tooltip .tt-status.active { background: rgba(0,229,204,0.15); color: #00E5CC; }
  .map-tooltip .tt-status.stale { background: rgba(245,158,11,0.15); color: #F59E0B; }
  .map-tooltip .tt-detail { color: #888; font-size: 12px; margin-top: 8px; }

  /* Legend */
  .map-legend {
    display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-family: var(--font-heading); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  }
  .legend-dot {
    width: 12px; height: 12px; border-radius: 3px;
  }

  /* Flow lines animation */
  @keyframes flowDash {
    to { stroke-dashoffset: -20; }
  }
  .flow-line {
    animation: flowDash 1.5s linear infinite;
  }
</style>
</head>

// Tooltip handling
const tooltip = document.getElementById('tooltip');

document.querySelectorAll('.node').forEach(node => {
  const key = node.dataset.tooltip;
  if (!key || !tips[key]) return;

  node.addEventListener('mouseenter', (e) => {
    const t = tips[key];
    const statusClass = t.status === 'active' ? 'active' : 'stale';
    tooltip.innerHTML = `
      <h4>${t.title}</h4>
      <span class="tt-status ${statusClass}">${t.status}</span>
      <div>${t.desc}</div>
      <div class="tt-detail">${t.detail}</div>
    `;
    tooltip.classList.add('show');
  });

  node.addEventListener('mousemove', (e) => {
    const x = Math.min(e.clientX + 16, window.innerWidth - 360);
    const y = Math.min(e.clientY - 10, window.innerHeight - 200);
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  });

  node.addEventListener('mouseleave', () => {
    tooltip.classList.remove('show');
  });
});

if (typeof NB !== 'undefined') NB.initSidebar('outreach-map');
